<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級語錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #e0e7ff 0%, #f1f5f9 50%, #e0f2fe 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* 極簡液態毛玻璃卡片 */
    .glass-panel {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 12px 32px -8px rgba(15, 23, 42, 0.06),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
    }

    /* 水滴感座號 */
    .seat-badge {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04), inset 0 1px 1px #fff;
    }
  </style>
</head>
<body class="py-10 px-4 text-slate-800">

  <div class="max-w-xl mx-auto">
    <!-- 簡潔標題與一鍵複製 -->
    <div class="flex items-center justify-between mb-4 px-2">
      <h1 class="text-xl font-semibold tracking-tight text-slate-800">班級語錄</h1>
      <button onclick="copyAll()" id="copy-btn" class="glass-panel px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-600 hover:bg-white/80 transition">
        複製全部
      </button>
    </div>

    <!-- 單一毛玻璃清單：左邊座號、右邊語錄 -->
    <div id="list" class="glass-panel rounded-3xl divide-y divide-white/60 overflow-hidden">
      <div class="p-8 text-center text-sm text-slate-400">載入中...</div>
    </div>
  </div>

  <script>
    // 請換成你的 Google Apps Script (/exec) 網址
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzrz7knLW8T9V1x70gjTJUHJ4-Ag1OxC9lY_yV5zNJ9IEfDVZagseIaeiTVw2ZaYWON/exec';

    let quotesData = [];

    async function loadData() {
      const list = document.getElementById('list');
      try {
        const res = await fetch(GAS_API_URL, { redirect: 'follow' });
        quotesData = await res.json();

        list.innerHTML = quotesData.map(item => `
          <div class="flex items-baseline gap-4 px-5 py-3.5 hover:bg-white/40 transition">
            <span class="seat-badge w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-semibold ${item.submitted ? 'text-slate-700' : 'text-slate-300'}">
              ${item.seat}
            </span>
            <span class="text-sm leading-relaxed break-words ${item.submitted ? 'text-slate-800 font-medium' : 'text-slate-300'}">
              ${item.submitted ? escapeHtml(item.quote) : '—'}
            </span>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = `<div class="p-8 text-center text-sm text-rose-500">資料讀取失敗</div>`;
      }
    }

    function copyAll() {
      if (!quotesData.length) return;
      const text = quotesData
        .map(d => `${d.seat}號：${d.submitted ? d.quote : ''}`)
        .join('\n');
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '已複製 ✓';
        setTimeout(() => btn.textContent = '複製全部', 1500);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    window.onload = loadData;
  </script>
</body>
</html>
